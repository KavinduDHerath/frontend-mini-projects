<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Pong Game by Kavi 👨‍💻</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <h1>Pong</h1>

    <div class="scoreboard">
      <span>🤾‍♂️ Player:<strong id="playerScore">0</strong></span>
      <span>🖥️ Computer:<strong id="computerScore">0</strong></span>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <p class="instructions">
      Move with your mouse 🖱️ or the <strong>↑</strong> and <strong>↓</strong> arrow keys. ⌨️
    </p>

    <button id="restartButton">Restart Game 🔄️</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
