<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Pong Game by Kavi 👨‍💻</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <h1>Pong</h1>

    <div class="scoreboard">
      <span>🤾‍♂️ Player:<strong id="playerScore">0</strong></span>
      <span>🖥️ Computer:<strong id="computerScore">0</strong></span>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <p class="instructions">
      Move with your mouse 🖱️, touch 📱, or the <strong>↑</strong> and <strong>↓</strong> arrow keys. ⌨️
    </p>

    <div class="controls">
      <div class="difficulty">
        <button class="diff-btn" data-speed="3">Easy</button>
        <button class="diff-btn active" data-speed="4.5">Medium</button>
        <button class="diff-btn" data-speed="7">Hard</button>
      </div>
      <button id="restartButton">Restart Game 🔄️</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
